<style>
:root{
  --bg:#F7F8F6;
  --surface:#FFFFFF;
  --surface-2:#EEF3F6;
  --text:#14263A;
  --text-muted:#5E6D7C;
  --border:#D3DDE5;
  --accent:#EF5A1F;
  --accent-ink:#7F2E0E;
  --accent-soft:#FCE7DD;
  --good:#2E9E5B;
  --good-soft:#DDF1E4;
  --cold:#2F6F9F;
  --cold-soft:#DCEAF4;
  --navy:#14263A;
  --navy-ink:#14263A;
  --pg:#2E9E5B;
  --pr:#D7263D;
  --pk:#1C1C1C;
  --font-display:'Barlow Condensed','Zen Kaku Gothic New',sans-serif;
  --font-body:'Zen Kaku Gothic New',-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F1822; --surface:#172331; --surface-2:#1F2D3B; --text:#EEF2F5; --text-muted:#9DADBC;
    --border:#2E3E4E; --accent:#FF7A45; --accent-ink:#FFD9C8; --accent-soft:#3A2416;
    --good:#4CC281; --good-soft:#1D3A2A; --cold:#6FAEDD; --cold-soft:#1B3246; --navy:#24364A; --navy-ink:#EEF2F5;
    --pg:#4CC281; --pr:#F0506A; --pk:#D8DEE4;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F1822; --surface:#172331; --surface-2:#1F2D3B; --text:#EEF2F5; --text-muted:#9DADBC;
  --border:#2E3E4E; --accent:#FF7A45; --accent-ink:#FFD9C8; --accent-soft:#3A2416;
  --good:#4CC281; --good-soft:#1D3A2A; --cold:#6FAEDD; --cold-soft:#1B3246; --navy:#24364A; --navy-ink:#EEF2F5;
  --pg:#4CC281; --pr:#F0506A; --pk:#D8DEE4;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;}
h1,h2,h3,h4{font-family:var(--font-body);font-weight:700;text-wrap:balance;margin:0;line-height:1.3;letter-spacing:0.01em;}
.num{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0.01em;}
.ic-svg{display:inline-block;vertical-align:-4px;flex:0 0 auto;}
button{font-family:inherit;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);}
.header-inner{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:10px;flex:1 1 auto;min-width:0;}
.brand h1{font-size:21px;font-weight:700;letter-spacing:0.02em;}
.brand .tagline{font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:0 0 auto;}
.lang-toggle button{border:none;background:var(--surface);color:var(--text-muted);font-size:12.5px;font-weight:700;padding:7px 13px;cursor:pointer;}
.lang-toggle button.active{background:var(--navy);color:#fff;}

/* bottom tab bar */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);}
.bottom-nav-inner{max-width:1080px;margin:0 auto;display:flex;}
.nav-btn{flex:1 1 0;border:none;background:transparent;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 9px;cursor:pointer;font-size:11px;font-weight:700;position:relative;}
.nav-btn .nav-ic{display:flex;line-height:1;}
.nav-btn .nav-ic .ic-svg{vertical-align:0;}
.nav-btn.active{color:var(--text);}
.nav-btn.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;background:var(--accent);border-radius:0 0 3px 3px;}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));}
body.map-mode{overflow:hidden;}
body.map-mode main{padding:0;}

/* search row */
.search-row{padding-block:12px 12px;display:flex;gap:10px;flex-wrap:wrap;}
.search-box{flex:1 1 100%;position:relative;}
.search-box input{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;font-family:inherit;}
.search-box input:focus{outline:2px solid var(--navy);outline-offset:-1px;}
.filter-scroll{flex:1 1 100%;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-scroll > *{flex:0 0 auto;}
select{padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13.5px;font-family:inherit;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;user-select:none;white-space:nowrap;}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.chip.on .star-ic{color:#FFC94D;}
.chip input{display:none;}

main{padding-block:16px 24px;}
.view-title{font-size:22px;margin-bottom:4px;}
.view-sub{color:var(--text-muted);font-size:13.5px;margin-bottom:16px;max-width:60ch;}
.result-count{color:var(--text-muted);font-size:13px;margin-bottom:8px;}

/* resort list */
.grid{display:grid;grid-template-columns:1fr;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
@media (min-width:760px){.grid{grid-template-columns:1fr 1fr;}}
.card{position:relative;background:var(--surface);border:none;border-bottom:1px solid var(--border);border-radius:0;padding:14px 16px 14px 20px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0;background:var(--piste,var(--border));}
.card:hover{background:var(--surface-2);}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.card h3{font-size:17px;line-height:1.3;}
.region-tag{font-size:12px;color:var(--text-muted);margin-top:1px;}
.weather-chip{flex:0 0 auto;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--cold);padding:2px 0;}
.weather-chip .num{font-size:15px;}
.meta-row{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--text-muted);}
.meta-row .dot{display:none;}
.price-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:2px;gap:8px;}
.price{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1;}
.price .num{font-size:22px;}
.price .unit{font-family:var(--font-body);font-size:11.5px;color:var(--text-muted);font-weight:500;}
.badge{font-size:11px;font-weight:700;border-radius:4px;padding:3px 7px;}
.badge.student{background:var(--good-soft);color:var(--good);}
.badge.open-soon{background:#FCE7DD;color:#7F2E0E;}
.open-soon-line{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:#7F2E0E;background:#FCE7DD;border-radius:4px;padding:3px 8px;margin:0 0 12px;}
.card-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.snow-badge{font-size:11px;font-weight:700;border-radius:4px;padding:3px 7px;background:var(--cold-soft);color:var(--cold);}
.fav-btn{border:none;background:transparent;color:var(--border);font-size:20px;line-height:1;cursor:pointer;padding:2px 4px;}
.fav-btn.on{color:#F2B01E;}
.star-ic{color:#F2B01E;}

/* hero: trail map */
.hero{position:relative;overflow:hidden;border-radius:14px;margin-bottom:16px;min-height:270px;background:linear-gradient(180deg,#E5EEF5 0%,#F3F7FA 48%,#FFFFFF 100%);border:1px solid var(--border);}
:root[data-theme="dark"] .hero,:root:not([data-theme="light"]) .hero{--hero-dark:1;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(180deg,#152536 0%,#1A2B3C 50%,#1F3142 100%);}}
:root[data-theme="dark"] .hero{background:linear-gradient(180deg,#152536 0%,#1A2B3C 50%,#1F3142 100%);}
.hero-svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:68%;display:block;}
.hero-content{position:relative;z-index:2;padding:22px 22px 0;}
.hero h2{font-size:30px;line-height:1.2;font-weight:700;color:var(--text);letter-spacing:0.01em;max-width:14em;}
.hero p{margin:8px 0 0;font-size:13.5px;line-height:1.6;color:var(--text-muted);max-width:30ch;}
.hero-stat{display:inline-block;margin-top:12px;font-size:12px;font-weight:500;color:var(--text-muted);border-top:1px solid var(--border);padding-top:6px;}
.hero-stat .num{font-size:14px;color:var(--text);}
@media (prefers-reduced-motion: reduce){.hero-svg .chair-moving{display:none;}}

/* wizard */
.wizard-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px 18px 18px;margin-bottom:18px;}
.q-block{padding:14px 0 16px;border-bottom:1px solid var(--border);}
.q-block:last-of-type{border-bottom:none;}
.q-label{font-size:14.5px;font-weight:700;margin-bottom:10px;}
.q-opt{font-size:12px;font-weight:500;color:var(--text-muted);}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;}
.pill{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:9px 15px;font-size:13.5px;font-weight:500;cursor:pointer;}
.pill.sel{background:var(--navy);border-color:var(--navy);color:#fff;}
.wizard-submit{width:100%;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;border-radius:10px;padding:14px;cursor:pointer;margin-top:12px;}
.wizard-submit:disabled{opacity:0.35;cursor:not-allowed;}

.reco-card{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--accent);border-radius:12px;padding:20px 20px 18px;margin-bottom:16px;}
.reco-eyebrow{font-size:13px;font-weight:700;color:var(--accent-ink);margin-bottom:6px;}
.reco-card h2{font-size:26px;margin-bottom:4px;}
.reco-sub{color:var(--text-muted);font-size:13px;margin-bottom:16px;}
.reco-approx-note{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;}
.reco-rows{display:flex;flex-direction:column;margin-bottom:16px;border-top:1px solid var(--border);}
.reco-row{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--border);}
.reco-row .ic{flex:0 0 auto;color:var(--text-muted);margin-top:1px;}
.reco-row .rt{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:2px;}
.reco-row .rv{font-size:13.5px;}
.packing-list{display:flex;flex-wrap:wrap;gap:6px;}
.packing-item{background:var(--cold-soft);color:var(--cold);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;}
.reco-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.reco-secondary-btn{flex:1 1 auto;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;}
.a2hs{margin-top:12px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:14px 14px 12px;font-size:13px;line-height:1.6;}
.a2hs b{display:block;font-size:13.5px;margin-bottom:2px;}
.a2hs-row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
.a2hs-row button{border:none;background:none;color:var(--text-muted);font-size:12.5px;font-weight:700;padding:6px 8px;cursor:pointer;}
.a2hs-row .a2hs-go{background:var(--navy);color:#fff;border-radius:6px;padding:6px 12px;}
.wx-credit{font-size:11px;color:var(--text-muted);}
.wx-credit a{color:inherit;}
.toast{white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;position:fixed;left:50%;bottom:calc(var(--nav-h,64px) + 16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;}
.toast.on{opacity:1;transform:translate(-50%,0);}
@media (prefers-reduced-motion:reduce){.toast{transition:none;}}
/* アプリ版：Webページらしい長押しメニュー・タップ時の灰色・引っぱりすぎのバウンドを消す（本文は選べるまま） */
html.native{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
html.native body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;}
html.native p, html.native .prep-txt, html.native .rv, html.native .sheet-sub{-webkit-user-select:text;user-select:text;}
.reco-detail-btn{flex:1 1 auto;border:none;background:var(--accent);color:#fff;border-radius:8px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;}

/* full-screen map */
.map-full{position:fixed;left:0;right:0;top:var(--hdr-h,64px);bottom:var(--nav-h,64px);z-index:5;background:#E8EEF3;}
#leafletMap{position:absolute;inset:0;}
.leaflet-container{font-family:var(--font-body);background:#E8EEF3;}
.map-top{position:absolute;top:10px;left:10px;right:10px;z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.map-top > *{pointer-events:auto;}
.map-search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 12px;box-shadow:0 4px 14px rgba(20,38,58,0.12);}
.map-search-ic{color:var(--text-muted);display:flex;}
.map-search input{flex:1;border:none;background:transparent;color:var(--text);font-size:15px;padding:12px 0;min-width:0;font-family:inherit;}
.map-search input:focus{outline:none;}
.map-suggest{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(20,38,58,0.14);}
.map-suggest button{display:flex;justify-content:space-between;gap:10px;width:100%;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);text-align:left;padding:11px 14px;font-size:14px;cursor:pointer;font-family:inherit;}
.map-suggest button:last-child{border-bottom:none;}
.map-suggest .sg-pref{color:var(--text-muted);font-size:12px;flex:0 0 auto;}
.map-chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.map-chips::-webkit-scrollbar{display:none;}
.map-chip{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(20,38,58,0.10);display:inline-flex;align-items:center;gap:5px;font-family:inherit;}
.map-chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.map-ctrls{position:absolute;right:12px;bottom:70px;z-index:500;display:flex;flex-direction:column;gap:8px;}
.map-ctrl{width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(20,38,58,0.16);display:flex;align-items:center;justify-content:center;font-family:inherit;}
.map-count{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:500;background:var(--navy);color:#fff;font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:0.03em;border-radius:6px;padding:5px 12px;white-space:nowrap;}
.map-count .rd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:2px;}
.pref-box{background:var(--navy);color:#fff;border:1.5px solid rgba(255,255,255,0.85);border-radius:5px;padding:2px 6px;text-align:center;font-size:10.5px;line-height:1.25;font-weight:700;box-shadow:0 3px 10px rgba(20,38,58,0.3);white-space:nowrap;cursor:pointer;transform:translate(-50%,-50%);display:inline-block;}
.pref-box .pc{font-family:var(--font-display);font-size:13px;letter-spacing:0.03em;}
.rpin{transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.rpin .rpin-dot{width:30px;height:30px;border-radius:50%;background:var(--accent);border:2px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(20,38,58,0.35);}
.rpin.mini .rpin-dot{width:22px;height:22px;background:#fff;border:2px solid var(--navy);color:var(--navy);}
.rpin.sel .rpin-dot{transform:scale(1.25);background:var(--navy);border-color:#fff;color:#fff;}
.rpin .rpin-label{display:none;margin-top:3px;background:rgba(255,255,255,0.94);color:#14263A;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px rgba(20,38,58,0.2);}
.show-labels .rpin .rpin-label{display:block;}
.leaflet-div-icon.yn-icon{background:transparent;border:none;}
.me-dot{width:16px;height:16px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,0.2);transform:translate(-50%,-50%);}
.map-preview{position:absolute;left:10px;right:10px;bottom:56px;z-index:600;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 10px 30px rgba(20,38,58,0.22);max-width:520px;margin:0 auto;}
.mp-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.mp-head h3{font-size:19px;line-height:1.2;}
.mp-sub{color:var(--text-muted);font-size:12.5px;margin-top:2px;}
.mp-stats{display:flex;gap:0;margin:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.mp-stat{flex:1 1 0;padding:8px 10px 8px 0;font-size:11.5px;color:var(--text-muted);border-right:1px solid var(--border);margin-right:10px;}
.mp-stat:last-child{border-right:none;margin-right:0;}
.mp-stat b{display:block;font-family:var(--font-display);font-size:20px;color:var(--text);font-weight:600;line-height:1.1;margin-bottom:2px;}
.mp-note{font-size:12.5px;color:var(--text-muted);margin:10px 0;}
.mp-actions{display:flex;gap:8px;}
.mp-actions a,.mp-actions button{flex:1;text-align:center;text-decoration:none;border-radius:8px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.mp-primary{background:var(--accent);color:#fff;border:none;}
.mp-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);}
.mini-terrain{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:2px;}

/* deals */
.deal-section{margin-bottom:26px;}
.deal-section h3{font-size:17px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.deal-list{display:flex;flex-direction:column;gap:10px;}
.deal-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:7px;}
.deal-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;}
.deal-cat{font-size:11px;font-weight:700;border-radius:4px;padding:3px 8px;background:var(--accent-soft);color:var(--accent-ink);}
.deal-cat.student{background:var(--good-soft);color:var(--good);}
.deal-cat.online{background:var(--cold-soft);color:var(--cold);}
.deal-until{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--text-muted);}
.deal-until.soon{color:var(--pr);}
.deal-card h4{font-size:15.5px;margin:0;font-weight:700;}
.deal-resort{font-size:12px;color:var(--text-muted);}
.deal-desc{font-size:13px;color:var(--text);margin:0;}
.deal-link{align-self:flex-start;background:var(--accent);color:#fff;text-decoration:none;font-size:12.5px;font-weight:700;border-radius:8px;padding:8px 12px;}
.stu-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;width:100%;text-align:left;font-family:inherit;color:inherit;}
.stu-row .sr-name{font-weight:700;font-size:14px;}
.stu-row .sr-pref{font-size:11.5px;color:var(--text-muted);}
.stu-row .sr-price{text-align:right;font-size:12px;color:var(--text-muted);flex:0 0 auto;}
.stu-row .sr-price b{font-family:var(--font-display);font-size:18px;color:var(--good);font-weight:600;}
.deal-empty{background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:20px;text-align:center;color:var(--text-muted);font-size:13px;}

/* gear */
.gear-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.gear-tab-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.gear-tab-btn.sel{background:var(--navy);border-color:var(--navy);color:#fff;}
.gear-tab-btn .dot-missing{width:6px;height:6px;border-radius:50%;background:var(--text-muted);opacity:0.5;}
.gear-product-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;text-align:center;}
.gear-product-ic{font-size:44px;margin-bottom:10px;color:var(--text-muted);}
.gear-product-name{font-size:17px;font-weight:700;margin-bottom:6px;}
.gear-product-tag{font-size:11.5px;font-weight:700;color:var(--good);background:var(--good-soft);border-radius:4px;padding:3px 10px;display:inline-block;margin-bottom:14px;}
.gear-product-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px;font-weight:700;border-radius:8px;padding:12px 20px;}
.gear-empty-card{background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:28px;text-align:center;color:var(--text-muted);font-size:13.5px;}

/* detail sheet */
.overlay{position:fixed;inset:0;background:rgba(20,38,58,0.55);display:flex;justify-content:center;align-items:flex-end;z-index:50;padding-top:env(safe-area-inset-top,0px);}
.overlay[hidden]{display:none;}
.sheet{width:100%;max-width:720px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:20px 20px calc(28px + env(safe-area-inset-bottom,0px));}
@media (min-width:760px){.overlay{align-items:center;padding-top:0;} .sheet{border-radius:14px;max-height:88vh;margin-block:20px;}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:2px;}
.sheet-head h2{font-size:25px;line-height:1.25;}
.close-btn{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer;flex:0 0 auto;}
.sheet-sub{color:var(--text-muted);font-size:13px;margin-bottom:16px;line-height:1.55;}
.section-label{font-size:13.5px;font-weight:700;color:var(--text);margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.info-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px 18px;margin:14px 0 6px;}
.info-card{border-left:2px solid var(--border);padding:2px 0 2px 12px;}
.info-card .big{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.1;}
.info-card .label{font-size:11.5px;color:var(--text-muted);margin-top:4px;line-height:1.45;}
.terrain-bar{display:flex;height:10px;border-radius:3px;overflow:hidden;margin-bottom:8px;}
.terrain-legend{display:flex;gap:14px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;margin-bottom:6px;}
.terrain-legend span{display:inline-flex;align-items:center;gap:5px;}
.swatch{width:10px;height:10px;border-radius:2px;display:inline-block;}
.cta-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;background:var(--accent);color:#fff;text-decoration:none;font-size:12.5px;font-weight:700;border-radius:8px;padding:9px 12px;}
.cta-btn:hover{opacity:0.92;}
.cta-btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--border);}
.prep .cta-btn:not(.sec){background:var(--navy);}
.sheet-bar{position:sticky;bottom:calc(-28px - env(safe-area-inset-bottom,0px));margin:18px -20px calc(-28px - env(safe-area-inset-bottom,0px));padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--border);display:flex;gap:8px;z-index:2;}
.sheet-bar a{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--navy);font-size:12px;font-weight:700;border:1px solid var(--border);border-radius:8px;padding:8px 4px;}

/* trip prep: a numbered sequence */
.prep{list-style:none;padding:0;margin:4px 0 18px;}
.prep-step{position:relative;padding:12px 0 14px 40px;border-bottom:1px solid var(--border);}
.prep-step:last-child{border-bottom:none;}
.prep-n{position:absolute;left:0;top:10px;width:28px;font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--text-muted);line-height:1;text-align:right;padding-right:0;}
.prep-h{font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center;margin-bottom:5px;}
.prep-txt{font-size:13px;margin-bottom:8px;}
.prep-sub{font-size:12px;color:var(--text-muted);}
.prep-btns{display:flex;gap:8px;flex-wrap:wrap;}
.prep-btns .cta-btn{border:none;cursor:pointer;font-family:inherit;}
.prep-btns .cta-btn.sec{border:1px solid var(--border);}
.checked-at{font-size:12px;color:var(--text-muted);margin:6px 0 10px;}
.disclaimer{font-size:11.5px;color:var(--text-muted);border-top:1px solid var(--border);padding-top:12px;margin-top:6px;line-height:1.6;}
.empty{padding-block:40px;text-align:center;color:var(--text-muted);}
.gear-intro{font-size:14px;margin:0 0 12px;max-width:60ch;}
.gear-list{list-style:none;padding:0;margin:0 0 18px;counter-reset:gear;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.gear-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border);}
.gear-item:last-child{border-bottom:none;}
ol.gear-list .gear-item::before{counter-increment:gear;content:counter(gear);font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--text-muted);width:20px;text-align:right;flex:0 0 auto;}
.gear-item-main{flex:1;min-width:0;}
.gear-item-name{font-weight:700;font-size:14.5px;}
.gear-item-why{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.gear-item .cta-btn{flex:0 0 auto;}
.gear-btns{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;}
.info-card .unit{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--text-muted);margin-left:2px;}
.meta-access{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ad-note{font-size:11.5px;color:var(--text-muted);background:var(--surface-2);border-radius:6px;padding:7px 10px;margin:0 0 12px;line-height:1.5;}
.foot-links{text-align:center;font-size:12px;color:var(--text-muted);padding:18px 0 6px;}
.foot-links a{color:var(--text-muted);}
.hero h2{font-size:32px;}
.hero-svg .s-pk{stroke:#1C1C1C;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-svg .s-pk{stroke:#C9D2DA;}}
:root[data-theme="dark"] .hero-svg .s-pk{stroke:#C9D2DA;}

.nav-ic .ic-svg{stroke-width:2.1;}
.hero-svg .s-far{fill:#D9E4EC;}
.hero-svg .s-mid{fill:#FFFFFF;}
.hero-svg .s-shade{fill:#E3EBF1;}
.hero-svg .s-field{fill:#FFFFFF;}
.hero-svg .s-ink{fill:#14263A;stroke:#14263A;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .hero-svg .s-far{fill:#223548;}
  :root:not([data-theme="light"]) .hero-svg .s-mid{fill:#2A3F53;}
  :root:not([data-theme="light"]) .hero-svg .s-shade{fill:#203242;}
  :root:not([data-theme="light"]) .hero-svg .s-field{fill:#2F4559;}
  :root:not([data-theme="light"]) .hero-svg .s-ink{fill:#EEF2F5;stroke:#EEF2F5;}
}
:root[data-theme="dark"] .hero-svg .s-far{fill:#223548;}
:root[data-theme="dark"] .hero-svg .s-mid{fill:#2A3F53;}
:root[data-theme="dark"] .hero-svg .s-shade{fill:#203242;}
:root[data-theme="dark"] .hero-svg .s-field{fill:#2F4559;}
:root[data-theme="dark"] .hero-svg .s-ink{fill:#EEF2F5;stroke:#EEF2F5;}

/* ===== v2 polish (2026-11) ===== */
/* detail: no empty "—" tiles */
.info-card .big.soft{font-family:var(--font-body);font-size:15px;font-weight:700;color:var(--text-muted);padding-top:6px;}
.info-card.wx-pending{grid-column:span 2;display:flex;align-items:center;gap:10px;color:var(--text-muted);}
.info-card.wx-pending .label{margin:0;}
/* search cards */
.card::before{display:none;}
.card{padding-left:16px;}
.card .price-row{margin-top:auto;align-items:center;}
.price-unknown{display:inline-block;font-family:var(--font-body);font-size:12px;font-weight:700;color:var(--text-muted);background:var(--surface-2);border-radius:6px;padding:4px 8px;}
.card-badges{align-items:center;}
.card-terrain{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);white-space:nowrap;}
.card-terrain .mt-bar{display:inline-flex;width:44px;height:6px;border-radius:3px;overflow:hidden;background:var(--border);}
.card-terrain .mt-bar i{display:block;height:100%;}
.card-terrain .mt-lab{font-family:var(--font-body);font-weight:700;font-size:11.5px;}
/* map: merged prefecture labels */
.pref-box .pm{font-weight:500;opacity:0.75;margin-left:2px;font-size:9.5px;}
.pref-box.multi{box-shadow:0 3px 10px rgba(20,38,58,0.3),3px 3px 0 -1px var(--navy),3px 3px 0 0 rgba(255,255,255,0.85);}
/* wizard submit hint */
.submit-hint{margin:8px 0 0;text-align:center;font-size:12.5px;color:var(--text-muted);min-height:1em;}
.submit-hint:empty{display:none;}
.wizard-submit:disabled{opacity:1;background:var(--surface-2);color:var(--text-muted);}
@media (min-width:760px){.grid .card:nth-child(odd){border-right:1px solid var(--border);}}
/* result card: weather line */
.reco-place{margin-bottom:10px;}
.reco-wx{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 14px;font-size:13px;color:var(--text);}
.reco-wx .rw-now{display:inline-flex;align-items:center;gap:4px;font-weight:700;}
.reco-wx .rw-now .num{font-size:15px;}
.reco-wx .rw-asof{font-size:11.5px;color:var(--text-muted);}
/* reco card v2 */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.reco-card{padding:22px 20px 18px;box-shadow:0 10px 30px -18px rgba(20,38,58,0.35);}
.reco-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:0.04em;}
.reco-card h2{font-size:clamp(24px,6vw,30px);line-height:1.25;margin-bottom:6px;}
.reco-place{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text-muted);margin-bottom:16px;}
.reco-stats{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:14px;}
.reco-stat{background:var(--surface-2);border-radius:10px;padding:10px 12px 11px;min-width:0;}
.reco-stat .sl{font-size:11.5px;font-weight:700;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reco-stat .sv{font-size:28px;line-height:1.1;color:var(--text);margin-top:2px;white-space:nowrap;}
.reco-stat .sv .u,.reco-stat .sv .cur{font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--text-muted);margin-left:2px;}
.reco-stat .sv .cur{margin:0 1px 0 0;font-family:var(--font-display);font-size:18px;color:var(--text);}
.reco-stat .sv .soft{font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--text-muted);}
.reco-match{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.reco-match .mt{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px 4px 8px;}
.reco-match .mt .ic-svg{vertical-align:0;stroke-width:2.4;}
.reco-match .mt.ok{background:var(--good-soft);color:var(--good);}
.reco-match .mt.check{background:var(--surface-2);color:var(--text-muted);}
.reco-match .mt.no{background:var(--accent-soft);color:var(--accent-ink);}
.reco-row .rv-sub{font-size:12px;color:var(--text-muted);}
.reco-detail-btn{flex:2 1 auto;font-size:14.5px;padding:13px;}
@media (max-width:520px){.reco-stat{padding:9px 10px 10px;}.reco-stat .sv{font-size:24px;}.reco-stat .sv .cur{font-size:15px;}}
#wizardResult{scroll-margin-top:calc(var(--hdr-h,64px) + 12px);}

/* header: keep logo and language toggle on one line on phones */
.header-inner{flex-wrap:nowrap;}
@media (max-width:520px){
  .brand{flex-direction:column;align-items:flex-start;gap:0;}
  .brand h1{font-size:19px;line-height:1.2;}
  .brand .tagline{font-size:11.5px;max-width:100%;}
}
/* hero: text and illustration no longer overlap; illustration keeps its proportions */
.hero{display:grid;min-height:0;}
.hero-content{padding:24px 22px 0;}
.hero-content{order:0;}
.hero-svg{order:1;position:relative;inset:auto;width:100%;height:auto;aspect-ratio:400/125;margin-top:-2%;z-index:1;pointer-events:none;}
.hero h2{font-size:clamp(28px,7.4vw,40px);}
.hero p{max-width:26em;text-wrap:pretty;}
.hero-stat{display:inline-flex;align-items:baseline;gap:3px;flex-wrap:wrap;font-size:12px;margin-top:14px;border-top:none;padding:5px 10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text-muted);}
@media (min-width:720px){
  .hero{grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr);align-items:end;}
  .hero-content{grid-column:1;grid-row:1;padding:40px 8px 40px 40px;align-self:center;}
  .hero-svg{grid-column:2;grid-row:1;aspect-ratio:400/230;margin:0 0 -1px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);mask-image:linear-gradient(90deg,transparent 0,#000 22%);}
}

/* ===== 2026-11-23 design pass: CEO's photos, piste colours, lift-ticket result ===== */
/* hero: the author's own photo (sea of clouds) */
.photo-hero{position:relative;overflow:hidden;border-radius:16px;margin-bottom:16px;min-height:360px;background:#9DB4C8;color:#fff;isolation:isolate;}
.photo-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;z-index:-2;}
.photo-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(14,30,48,0.62) 0%,rgba(14,30,48,0.28) 42%,rgba(14,30,48,0) 62%,rgba(14,30,48,0.25) 100%);}
.photo-hero .hero-content{padding:26px 22px 22px;}
.photo-hero h2{font-size:clamp(30px,8vw,46px);line-height:1.15;font-weight:700;letter-spacing:0.02em;color:#fff;text-shadow:0 2px 16px rgba(10,24,40,0.35);}
.photo-hero p{margin:10px 0 0;font-size:14px;line-height:1.6;color:rgba(255,255,255,0.92);max-width:24em;text-shadow:0 1px 8px rgba(10,24,40,0.4);}
.photo-hero .hero-stat{display:inline-flex;align-items:baseline;gap:3px;margin-top:14px;font-size:12px;color:#fff;background:rgba(14,30,48,0.38);border:1px solid rgba(255,255,255,0.35);border-radius:999px;padding:5px 12px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.photo-hero .hero-stat .num{font-size:15px;color:#fff;}
.photo-credit{position:absolute;right:12px;bottom:9px;font-size:10.5px;color:rgba(255,255,255,0.85);text-shadow:0 1px 4px rgba(0,0,0,0.45);}
@media (min-width:720px){.photo-hero{min-height:440px;}.photo-hero .hero-content{padding:44px 44px 0;}}

/* banner photo on the deals and gear tabs */
.view-photo{position:relative;margin:0 0 16px;height:150px;border-radius:14px;overflow:hidden;background:#9DB4C8;}
.view-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.view-photo figcaption{position:absolute;right:10px;bottom:7px;font-size:10.5px;color:rgba(255,255,255,0.9);text-shadow:0 1px 4px rgba(0,0,0,0.5);}
.empty-photo{display:block;width:min(260px,70%);aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin:0 auto 14px;}
.empty p{margin:0;}

/* piste colours: green = beginner, red = intermediate, black = advanced (as on Japanese trail signs) */
.pill.lv,.gear-tab-btn.lv{display:inline-flex;align-items:center;gap:7px;}
.pill.lv::before,.gear-tab-btn.lv::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--lvc);flex:0 0 auto;}
.lv-0{--lvc:var(--pg);} .lv-1{--lvc:var(--pr);} .lv-2{--lvc:var(--pk);}
.pill.lv-first::before{background:transparent;box-shadow:inset 0 0 0 2px var(--pg);}
.pill.lv.sel,.gear-tab-btn.lv.sel{background:var(--lvc);border-color:var(--lvc);color:#fff;}
.pill.lv.sel::before,.gear-tab-btn.lv.sel::before{background:#fff;box-shadow:none;}
:root[data-theme="dark"] .lv-2.sel{color:#14263A;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv-2.sel{color:#14263A;}}

/* gear: one compact Amazon | Rakuten switch per item */
.buy-seg{display:inline-flex;flex:0 0 auto;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface);}
.buy-seg a{padding:8px 12px;font-size:12px;font-weight:700;color:var(--text);text-decoration:none;white-space:nowrap;}
.buy-seg a + a{border-left:1px solid var(--border);}
.buy-seg a:active{background:var(--surface-2);}

/* result: the recommendation is a lift ticket */
.reco-card.reco-card{background:transparent;border:none;box-shadow:none;padding:0;border-radius:0;}
.ticket{position:relative;margin:4px 0 16px;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--border);box-shadow:0 14px 34px -20px rgba(20,38,58,0.45);}
.ticket::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--lvc);}
.tk-main{position:relative;padding:22px 20px 18px 28px;}

.tk-stub::before,.tk-stub::after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--border);}
.tk-stub::before{left:-12px;} .tk-stub::after{right:-12px;}
.tk-stub{background-image:linear-gradient(90deg,rgba(255,255,255,0.55) 50%,transparent 0);background-size:10px 1.5px;background-repeat:repeat-x;background-position:0 0;}

// iPhone／Androidアプリ（Capacitor）で動いているか。アプリではWebサイトの最新データを取りに行き、
// 圏外などで取れなければアプリに同梱したデータを使う
const IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const SITE_BASE = "https://yukinavi-app.github.io/yukinavi/";
if(IS_NATIVE) document.documentElement.classList.add("native");
async function fetchData(path, opts){
  if(IS_NATIVE){
    try{
      // 電波が弱いと待たされるので、3秒で諦めて同梱データを使う
      const ctl = new AbortController(); const timer = setTimeout(()=>ctl.abort(), 3000);
      const res = await fetch(SITE_BASE + path + "?t=" + Math.floor(Date.now()/600000), Object.assign({}, opts, {signal:ctl.signal}));
      clearTimeout(timer);
      if(res.ok) return res;
    }catch(e){ /* 圏外：同梱データへ */ }
  }
  return fetch(path, opts);
}
// アプリ版では外部リンクを必ずSafariで開く（アプリ内に他社ページを表示しない。Amazon等の規約とAppleのプライバシー申告のため）
if(IS_NATIVE){
  document.addEventListener("click", e=>{
    const a = e.target.closest && e.target.closest("a[href]");
    if(!a) return;
    const href = a.getAttribute("href");
    if(!/^https?:\/\//.test(href)) return;
    e.preventDefault();
    const AL = window.Capacitor.Plugins && window.Capacitor.Plugins.AppLauncher;
    if(AL) AL.openUrl({url: href}); else window.open(href, "_system");
  }, true);
}

}

// ロングテール全国ゲレンデ（簡易情報のみ、data/resorts_all.jsonから読み込む）

async function loadAllResorts(){
  try{
    const res = await fetchData("data/resorts_all.json");
    ALL_RESORTS = await res.json();
  }catch(e){
    ALL_RESORTS = [];
  }
}
// アフィリエイト：楽天は任意のURLを公式の汎用リンク（hgc）で包むと成果計測される
const AFF = { rakuten: "59db25da.f3366089.59db25db.43c478c4" };
function rakutenAff(url){
  const e = encodeURIComponent(url);
  return `https://hb.afl.rakuten.co.jp/hgc/${AFF.rakuten}/?pc=${e}&m=${e}`;
}
// Klook（訪日向け）。公式のリンク生成ルール：affiliate.klook.com/redirect?aid=…&aff_label1〜3=…&k_site=<エンコードしたKlookのURL>
const KLOOK = { aid: "143472" };
function klookAff(url, place, rid){
  return `https://affiliate.klook.com/redirect?aid=${KLOOK.aid}&aff_label1=yukinavi&aff_label2=${encodeURIComponent(place||"")}&aff_label3=${encodeURIComponent(rid||"")}&k_site=${encodeURIComponent(url)}`;
}
function klookSearch(q, place, rid){ return klookAff(`https://www.klook.com/en-US/search/result/?query=${encodeURIComponent(q)}`, place, rid); }
// 宿：日本語は楽天トラベル、英語は日本語の予約画面で離脱しないようKlookへ
function stayUrl(r){
  return state.lang==="ja"
    ? rakutenAff(`https://travel.rakuten.co.jp/dosearch/?f_keyword=${encodeURIComponent(r.nameJa+" 周辺 宿泊")}`)
    : klookSearch(`${r.nameEn} hotel`, "stay", r.id);
}
function busUrl(r){ return state.lang==="ja" ? rakutenAff("https://travel.rakuten.co.jp/bus/") : klookSearch(`${r.nameEn} bus`, "bus", r.id); }
function rakutenSearch(keyword){ return rakutenAff(`https://search.rakuten.co.jp/search/mall/${encodeURIComponent(keyword)}/`); }
// Amazonアソシエイト（検索結果へのリンクにtagを付ける公式の方法）

function amazonSearch(keyword){ return `https://www.amazon.co.jp/s?k=${encodeURIComponent(keyword)}&tag=${AMAZON_TAG}`; }

const FAV_KEY = "yukinavi_favs";
const OLD_FAV_KEY = "yukinav_favs";
let FAVS = new Set();
try{
  // 旧名称（YukiNav）時代のお気に入りを引き継ぐ
  FAVS = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || localStorage.getItem(OLD_FAV_KEY) || "[]"));
  localStorage.setItem(FAV_KEY, JSON.stringify([...FAVS]));
  localStorage.removeItem(OLD_FAV_KEY);
  localStorage.removeItem("yukinavi_wx");
}catch(e){}
function isFav(id){ return FAVS.has(id); }
function toggleFav(id){
  if(FAVS.has(id)) FAVS.delete(id); else FAVS.add(id);
  try{ localStorage.setItem(FAV_KEY, JSON.stringify([...FAVS])); }catch(e){}
  if(IS_NATIVE) scheduleOpeningAlerts(FAVS.has(id) ? id : null);
}

// アプリ版だけ：お気に入りのスキー場のオープン日の朝8時に、端末の中で通知を出す（サーバーには何も送らない）
function notifId(rid){ let h = 0; for(const c of rid) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h) % 2000000000; }
async function scheduleOpeningAlerts(justAdded){
  const LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
  if(!LN) return;
  try{
    const today = todayIso();
    const targets = RESORTS.filter(r=>FAVS.has(r.id) && r.openDate && r.openDate > today);
    const asking = justAdded && targets.some(r=>r.id===justAdded);
    let perm = await LN.checkPermissions();
    if(perm.display !== "granted" && asking) perm = await LN.requestPermissions();
    if(perm.display !== "granted") return;
    const pending = await LN.getPending();
    if(pending.notifications.length) await LN.cancel({notifications: pending.notifications.map(n=>({id:n.id}))});
    if(targets.length) await LN.schedule({notifications: targets.map(r=>{
      const [y,m,d] = r.openDate.split("-").map(Number);
      const name = state.lang==="ja" ? r.nameJa : r.nameEn;
      return {id:notifId(r.id), title:t("openAlertTitle")(name), body:t("openAlertBody"), schedule:{at:new Date(y, m-1, d, 8, 0)}, extra:{rid:r.id}};
    })});
    if(asking) showToast(t("openAlertSet"));
  }catch(e){ console.warn("notification schedule failed", e); }
}
function showToast(msg){
  let el = document.getElementById("toast");
  if(!el){ el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("on"), 2800);
}

// 検索カード用：コース比率のミニバー＋初心者コースの割合（初心者が一番気にする数字）
function miniTerrain(r){
  if(!r.terrain) return "";
  const lab = state.lang==="ja" ? `初心者 ${r.terrain[0]}%` : `Beginner ${r.terrain[0]}%`;
  const full = state.lang==="ja" ? `コース比率 初級${r.terrain[0]}%・中級${r.terrain[1]}%・上級${r.terrain[2]}%` : `Runs: ${r.terrain[0]}% beginner, ${r.terrain[1]}% intermediate, ${r.terrain[2]}% advanced`;
  return `<span class="card-terrain" title="${full}" aria-label="${full}"><span class="mt-bar" aria-hidden="true">${r.terrain.map((p,i)=>`<i style="width:${p}%;background:${terrainColors[i]}"></i>`).join("")}</span><span class="mt-lab">${lab}</span></span>`;
}
function pisteVar(r){ if(!r.terrain) return ""; const i = r.terrain.indexOf(Math.max(...r.terrain)); return terrainColors[i]; }
function SEP(){ return state.lang==="ja" ? "／" : ", "; }
function fromCityText(city, km){ return state.lang==="ja" ? `${city}から <span class="num">${km}km</span>` : `<span class="num">${km}km</span> from ${city}`; }

function t(key){ return STRINGS[state.lang][key]; }

// 英語まわりは日本語で使う人には不要なので、英語表示のときだけ出す
const MUST_EN_ONLY = ["mustEnglish","mustEnglishOk"];
function mustOpts(){ return state.lang==="ja" ? MUST_ALL.filter(k=>!MUST_EN_ONLY.includes(k)) : MUST_ALL; }
// ナイター・温泉・子ども連れは公式情報をもとにした紹介文に書かれているかで判断（書かれていなければ「公式で確認」）
const NO_NIGHT = /ナイター(営業)?(は)?(なし|ありません|休止)/;
// 近くに町：スキー場から2km以内の飲食店とコンビニ・スーパーの数（OpenStreetMapで数えたもの。scripts/fetch_town.py）
// 飲食店10軒以上、または6軒以上＋コンビニ・スーパーあり（白馬八方・野沢温泉・草津などが入り、山の中の単独のゲレンデは入らない線）
function hasTown(r){ return r.town ? (r.town.food >= 10 || (r.town.food >= 6 && r.town.shop >= 1)) : null; }
function mustValue(r, key){
  const desc = r.descJa || "";
  if(key==="mustNight") return NO_NIGHT.test(desc) ? false : desc.includes("ナイター") ? true : null;
  if(key==="mustOnsen") return (desc + r.nameJa).includes("温泉") ? true : null;
  if(key==="mustKids") return /キッズ|ファミリー|子ども|子供|ちびっこ/.test(desc) ? true : null;
  if(key==="mustStudent") return r.liftStudent!=null ? true : null;
  if(key==="mustBig") return r.courses==null ? null : r.courses >= 15;
  if(key==="mustEnglishOk") return r.english ? (r.english==="medium" || r.english==="high") : null;
  if(key==="mustRental") return r.rental ? r.rental.available : null;
  if(key==="mustSchool") return r.school ? r.school.available : null;
  if(key==="mustEnglish") return r.school ? r.school.english : null;
  if(key==="mustTown") return hasTown(r);
  if(key==="mustOnline") return !!(r.ticket && r.ticket.onlineUrl) || null;
  return null;
}
function buildMustPills(){
  const el = document.getElementById("pillMust");
  if(state.lang==="ja") MUST_EN_ONLY.forEach(k=>wiz.must.delete(k));
  el.innerHTML = mustOpts().map(k=>`<button type="button" class="pill ${wiz.must.has(k)?"sel":""}" data-must="${k}">${t(k)}</button>`).join("");
  el.querySelectorAll(".pill").forEach(btn=>btn.addEventListener("click", ()=>{
    const k = btn.dataset.must;
    if(wiz.must.has(k)) wiz.must.delete(k); else wiz.must.add(k);
    btn.classList.toggle("sel", wiz.must.has(k));
  }));
}

function buildPills(container, items, groupKey, labelFn){
  const el = document.getElementById(container);
  el.innerHTML = items.map((item,i)=>`<button type="button" class="pill" data-group="${groupKey}" data-idx="${i}">${labelFn(item,i)}</button>`).join("");
  el.querySelectorAll(".pill").forEach(btn=>{
    btn.addEventListener("click",()=>{
      el.querySelectorAll(".pill").forEach(b=>b.classList.remove("sel"));
      btn.classList.add("sel");
      wiz[groupKey] = Number(btn.dataset.idx);
      updateSubmitState();
    });
  });
}

// 詳細データ（RESORTS）と簡易リスト（ALL_RESORTS）の重複を除いた件数。
// 地図と同じ基準（1.5km以内は同一）＋座標のない簡易データは名前で照合する
function distinctResortCount(){
  const norm = x=>String(x||"").replace(/[\s・(（].*$/,"").slice(0,6);
  const mainNames = RESORTS.map(r=>norm(r.nameJa));
  const extra = ALL_RESORTS.filter(x=>{
    if(x.lat!=null && x.lng!=null) return !RESORTS.some(r=>r.lat!=null && distKmBetween(r,x)<1.5);
    const k = norm(x.name);
    return !mainNames.some(m=>m && (m.startsWith(k) || k.startsWith(m)));
  });
  return RESORTS.length + extra.length;
}
function renderHeroStat(){
  const el = document.getElementById("heroStat");
  if(!RESORTS.length || !ALL_RESORTS.length){ el.hidden = true; return; }
  const n = distinctResortCount();
  el.innerHTML = t("heroStat").replace("{n}", `<span class="num">${n}</span>`).replace("{d}", `<span class="num">${RESORTS.length}</span>`);
  el.hidden = false;
}

function matches(r){
  const q = state.query.trim().toLowerCase();
  const name = (state.lang==="ja" ? r.nameJa+r.prefJa : r.nameEn+" "+r.prefEn).toLowerCase();
  if(q && !name.includes(q)) return false;
  if(state.region!=="all" && r.region!==state.region) return false;
  if(state.studentOnly && r.liftStudent==null) return false;
  if(state.englishOnly && r.english==="low") return false;
  if(state.favOnly && !isFav(r.id)) return false;
  return true;
}

const WX_COND = {snow:["雪","Snow"], sleet:["みぞれ","Sleet"], clear:["快晴","Clear"], sunny:["晴れ","Sunny"], partly:["晴れ時々くもり","Partly cloudy"], cloudy:["くもり","Cloudy"], fog:["霧","Fog"], rain:["雨","Rain"], storm:["雷雨","Thunderstorm"]};
function applyWeather(r, w, asOf){
  if(!w) return;
  const c = WX_COND[w.c] || WX_COND.cloudy;
  r.weather = {tempC:w.t, condJa:c[0], condEn:c[1], wind:w.w, snowDays:w.sd, elevation:w.e};
  r.weatherAsOf = asOf;
}

// 天気はGitHub Actionsが3時間ごとに data/weather.json へまとめて取得している（訪問者ごとに気象APIを呼ばない）
// 圏外でも直近の天気を見られるよう、端末にも保存する
const WX_KEY = "yukinavi_wx2";
function applyWeatherFile(o){
  if(!o || !o.wx) return false;
  const asOf = Date.parse(o.updatedAt);
  // 12時間以上前のデータは出さない（取得が止まっても古い天気を見せない）
  if(!(Date.now() - asOf < 12*3600000)) return false;
  RESORTS.forEach(r=>applyWeather(r, o.wx[r.id], asOf));
  // 気象庁アメダスの積雪（観測値）。近くの観測点の値で、スキー場の値ではない
  const amAt = o.amedasAt ? Date.parse(o.amedasAt) : null;
  RESORTS.forEach(r=>{ r.amedas = (o.amedas && o.amedas[r.id] && o.amedas[r.id].s > 0) ? o.amedas[r.id] : null; r.amedasAt = amAt; });
  return true;
}
function loadWeatherCache(){
  try{
    const o = JSON.parse(localStorage.getItem(WX_KEY) || "null");
    if(o && Date.now() - Date.parse(o.updatedAt) < 3*86400000) applyWeatherFile(o);
  }catch(e){}
}

let WX_DONE = false;
async function loadAllLiveWeather(){
  try{
    const res = await fetchData("data/weather.json", {cache:"no-cache"});
    if(!res.ok) throw new Error("weather http " + res.status);
    const o = await res.json();
    if(applyWeatherFile(o)){ try{ localStorage.setItem(WX_KEY, JSON.stringify(o)); }catch(e){} }
  }catch(err){
    console.warn("weather load failed", err);
  }
  WX_DONE = true;
  render();
}

function weatherStale(r){ return r.weatherAsOf && Date.now() - r.weatherAsOf > 6*3600000; }

// オープン予定日は「オープン前」の間だけ表示する。日付未定（「12月中旬予定」等）は年明けまでだけ出す
const OPEN_NOTE_UNTIL = "2027-01-16";
function todayIso(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function openInfo(r){
  const today = todayIso();
  if(r.openDate){
    if(today >= r.openDate) return null;
    const [, m, d] = r.openDate.split("-").map(Number);
    return {long:t("openSoon")(m,d), short:t("openSoonShort")(m,d)};
  }
  if(r.openNote && !r.alreadyOpen && today < OPEN_NOTE_UNTIL){
    const txt = state.lang==="ja" ? r.openNote : t("openNotYet");
    return {long:txt, short:t("openNotYet")};
  }
  return null;
}

const NO_WX = {tempC:null,condJa:"",condEn:"",wind:null,snowDays:null,elevation:null};
function wx(r){ return r.weather || NO_WX; }
function nv(v, unit){ return v==null ? "—" : `${v}${unit||""}`; }
function weatherIcon(condJa){
  if(!condJa) return "";
  if(condJa.includes("雪")||condJa.includes("みぞれ")||condJa.includes("Snow")||condJa.includes("Sleet")||condJa.includes("パウダー")||condJa.includes("Powder")) return icon("snow",18);
  if(condJa.includes("雨")||condJa.includes("Rain")||condJa.includes("雷")||condJa.includes("Thunderstorm")) return icon("rain",18);
  if(condJa.includes("曇")||condJa.includes("くもり")||condJa.includes("霧")||condJa.includes("Cloud")||condJa.includes("Fog")) return icon("cloud",18);
  return icon("sun",18);
}

function yen(v){ return v===0 ? t("freeLabel") : "¥"+v.toLocaleString(); }
function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function safeUrl(u){ return /^https:\/\//.test(u||"") ? escapeHtml(u) : "#"; }

function snowBadge(r){
  const w = r.weather;
  if(!w || w.snowDays==null || w.snowDays < 1) return "";
  return `<span class="snow-badge">${icon("snow",12)} ${t("snow7dShort")(w.snowDays)}</span>`;
}

function sortList(list){
  const arr = list.slice();
  if(state.sort==="snow") arr.sort((a,b)=>((b.weather&&b.weather.snowDays)||0)-((a.weather&&a.weather.snowDays)||0));
  else if(state.sort==="price") arr.sort((a,b)=>(a.liftAdult==null?1e9:a.liftAdult)-(b.liftAdult==null?1e9:b.liftAdult));
  else arr.sort((a,b)=>a.distKm-b.distKm);
  return arr;
}

function prefLabel(ja){ return state.lang==="ja" ? ja : (PREF_EN[ja]||ja); }

function distKmBetween(a,b){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

let MAP_POINTS = [];
function buildMapPoints(){
  const main = RESORTS.filter(r=>r.lat!=null&&r.lng!=null).map(r=>({kind:"main", id:r.id, lat:r.lat, lng:r.lng, prefJa:r.prefJa, r}));
  const mini = [];
  ALL_RESORTS.forEach((x,i)=>{
    if(x.lat==null||x.lng==null) return;
    // 詳細データのあるスキー場と同じ場所（1.5km以内）は二重表示しない
    if(main.some(m=>distKmBetween(m,x)<1.5)) return;
    mini.push({kind:"mini", id:"a"+i, lat:x.lat, lng:x.lng, prefJa:x.pref, nameJa:x.name});
  });
  MAP_POINTS = main.concat(mini);
}
function pointName(p){ return p.kind==="main" ? (state.lang==="ja"?p.r.nameJa:p.r.nameEn) : p.nameJa; }

function visiblePoints(){
  const f = MAP_FILTERS.find(x=>x.id===mapState.filter) || MAP_FILTERS[0];
  return MAP_POINTS.filter(f.test);
}

function setMapCount(html){ document.getElementById("mapCount").innerHTML = `<span class="rd"></span>${html}`; }

function renderMapLayer(){
  const m = mapState.map;
  if(!m || state.view!=="map") return;
  const z = m.getZoom();
  const pts = visiblePoints();
  mapState.layer.clearLayers();
  m.getContainer().classList.toggle("show-labels", z>=10);
  if(z < 8){
    const groups = {};
    pts.forEach(p=>{
      const g = groups[p.prefJa] || (groups[p.prefJa]={n:0,lat:0,lng:0});
      g.n++; g.lat+=p.lat; g.lng+=p.lng;
    });
    // 画面上で重なる県ラベルはまとめる（件数の多い県を代表名に）。ズームすると自然に分かれる
    const BOX_W = 64, BOX_H = 36;
    const clusters = [];
    Object.entries(groups).sort((a,b)=>b[1].n-a[1].n).forEach(([pref,g])=>{
      const pt = m.latLngToContainerPoint([g.lat/g.n, g.lng/g.n]);
      const hit = clusters.find(c=>Math.abs(c.x-pt.x)<BOX_W && Math.abs(c.y-pt.y)<BOX_H);
      if(hit){
        hit.prefs.push(pref); hit.lat+=g.lat; hit.lng+=g.lng;
        hit.x = (hit.x*hit.n + pt.x*g.n)/(hit.n+g.n); hit.y = (hit.y*hit.n + pt.y*g.n)/(hit.n+g.n); hit.n+=g.n;
      }else clusters.push({prefs:[pref], n:g.n, lat:g.lat, lng:g.lng, x:pt.x, y:pt.y});
    });
    clusters.forEach(cl=>{
      const c = [cl.lat/cl.n, cl.lng/cl.n];
      const more = cl.prefs.length - 1;
      const label = escapeHtml(prefLabel(cl.prefs[0])) + (more ? `<span class="pm">${state.lang==="ja" ? `ほか${more}` : ` +${more}`}</span>` : "");
      const title = cl.prefs.map(prefLabel).join(state.lang==="ja" ? "・" : ", ");
      const ic = L.divIcon({className:"yn-icon", html:`<div class="pref-box${more?" multi":""}">${label}<br><span class="pc">${cl.n}</span></div>`, iconSize:null});
      L.marker(c,{icon:ic, title}).on("click",(e)=>{
        L.DomEvent.stopPropagation(e);
        if(more){
          const ll = pts.filter(p=>cl.prefs.includes(p.prefJa)).map(p=>[p.lat,p.lng]);
          m.flyToBounds(ll, {padding:[60,60], maxZoom:9.5});
        }else m.flyTo(c, 9.5);
      }).addTo(mapState.layer);
    });
    setMapCount(t("mapCountPref")(pts.length, Object.keys(groups).length));
    return;
  }
  const view = m.getBounds();
  const pad = view.pad(0.25);
  const near = pts.filter(p=>pad.contains([p.lat,p.lng]));
  near.sort((a,b)=> a.kind===b.kind ? 0 : (a.kind==="mini" ? -1 : 1));
  near.forEach(p=>{
    const sel = mapState.selected===p.id ? " sel" : "";
    const html = `<div class="rpin${p.kind==="mini"?" mini":""}${sel}"><span class="rpin-dot">${icon("mountain", p.kind==="main"?16:12)}</span><span class="rpin-label">${escapeHtml(pointName(p))}</span></div>`;
    const ic = L.divIcon({className:"yn-icon", html, iconSize:null});
    L.marker([p.lat,p.lng],{icon:ic, title:pointName(p), zIndexOffset: (p.kind==="main"?1000:0) + (sel?2000:0)})
      .on("click",(e)=>{ L.DomEvent.stopPropagation(e); selectMapPoint(p); })
      .addTo(mapState.layer);
  });
  const shown = pts.filter(p=>view.contains([p.lat,p.lng])).length;
  setMapCount(t("mapCountView")(shown, pts.length));
}

function searchPoints(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  return MAP_POINTS.filter(p=>{
    const hay = (p.kind==="main" ? p.r.nameJa+" "+p.r.nameEn+" "+p.r.prefJa+" "+p.r.prefEn : p.nameJa+" "+p.prefJa+" "+(PREF_EN[p.prefJa]||"")).toLowerCase();
    return hay.includes(q);
  }).sort((a,b)=> a.kind===b.kind ? 0 : (a.kind==="main" ? -1 : 1)).slice(0,6);
}

function renderSuggest(){
  const box = document.getElementById("mapSuggest");
  const res = searchPoints(document.getElementById("mapSearch").value);
  if(!res.length){ box.hidden = true; box.innerHTML = ""; return; }
  box.innerHTML = res.map((p,i)=>`<button data-i="${i}"><span>${escapeHtml(pointName(p))}</span><span class="sg-pref">${escapeHtml(prefLabel(p.prefJa))}</span></button>`).join("");

  }));
}

function locateMe(){
  if(!navigator.geolocation){ setMapCount(t("locateFail")); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const c = [pos.coords.latitude, pos.coords.longitude];
    if(mapState.me) mapState.me.setLatLng(c);
    else mapState.me = L.marker(c,{icon:L.divIcon({className:"yn-icon", html:'<div class="me-dot"></div>', iconSize:null}), interactive:false, zIndexOffset:3000}).addTo(mapState.map);
    mapState.map.flyTo(c, 9);
  }, ()=>setMapCount(t("locateFail")), {enableHighAccuracy:false, timeout:8000});
}

function localToday(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function fmtDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return state.lang==="ja" ? `${y}年${m}月${d}日` : new Date(y,m-1,d).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});
}
function daysUntil(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((new Date(y,m-1,d) - now) / 86400000);
}
function dealResorts(d){
  const ids = d.resortIds && d.resortIds.length ? d.resortIds : (d.resortId ? [d.resortId] : []);
  return ids.map(id=>RESORTS.find(x=>x.id===id)).filter(Boolean);
}
function dealCard(d){
  const rs = dealResorts(d);
  const r = rs.length===1 ? rs[0] : null;
  const title = state.lang==="ja" ? d.titleJa : (d.titleEn || d.titleJa);
  const desc = state.lang==="ja" ? d.descJa : (d.descEn || d.descJa);
  const soon = !!d.validUntil && daysUntil(d.validUntil) <= 14;
  const where = r ? (state.lang==="ja" ? `${r.nameJa}（${prefLabel(r.prefJa)}）` : `${r.nameEn}, ${prefLabel(r.prefJa)}`)
    : rs.length > 1 ? rs.map(x=>state.lang==="ja"?x.nameJa:x.nameEn).join(state.lang==="ja"?"、":", ")
    : t("dealNational");
  const startsLater = d.validFrom && d.validFrom > localToday();
  const until = d.validUntil ? t("dealUntil")(fmtDate(d.validUntil)) : t("dealUntilSeasonEnd");
  const period = startsLater ? t("dealPeriod")(fmtDate(d.validFrom), d.validUntil ? fmtDate(d.validUntil) : t("dealSeasonEnd")) : until;
  return `
    <div class="deal-card">
      <div class="deal-top"><span class="deal-cat ${escapeHtml(d.category)}">${t("dealCat_"+d.category) || escapeHtml(d.category)}</span><span class="deal-until ${soon?"soon":""}">${period}</span></div>
      <h4>${escapeHtml(title)}</h4>
      <div class="deal-resort">${escapeHtml(where)}</div>
      <p class="deal-desc">${escapeHtml(desc)}</p>
      <a class="deal-link" href="${safeUrl(d.url)}" target="_blank" rel="noopener">${t("dealLink")}</a>
    </div>`;
}

function dealMatchesQuery(d, q){
  if(!q) return true;
  const names = dealResorts(d).map(r=>r.nameJa+" "+r.nameEn+" "+r.prefJa+" "+(r.prefEn||"")).join(" ");
  const hay = (names+" "+(d.titleJa||"")+" "+(d.titleEn||"")+" "+(dealResorts(d).length?"":t("dealNational"))).toLowerCase();
  return hay.includes(q);
}

    : [];
  let html = "";
  if(national.length) html += `<div class="deal-section"><h3>${t("dealSecNational")}</h3><div class="deal-list">${national.map(dealCard).join("")}</div></div>`;
  if(perResort.length) html += `<div class="deal-section"><h3>${t("dealSecResort")}</h3><div class="deal-list">${perResort.map(dealCard).join("")}</div></div>`;

const ROAD_FACTOR = 1.25;
function roadKmFrom(pref, r){
  const o = ORIGINS[pref.ja];
  if(!o || r.lat==null) return r.distKm;
  return Math.round(distKmBetween({lat:o[0],lng:o[1]}, r) * ROAD_FACTOR);
}

// 電車・バスで行けるか：調査データがあればそれを、なければアクセス文から判定（不明はnull）
function transitOk(r){
  if(r.transit && r.transit.byPublic!=null) return r.transit.byPublic;
  if(r.transit && r.transit.taxiOnly) return "taxi";
  const txt = (r.accessJa||"") + (r.timeJa||"");
  if(/駅|バス|シャトル|新幹線|電車|JR|鉄道/.test(txt)) return true;
  if(txt) return false;
  return null;
}

// 駅からの所要時間（分）をアクセス文から読む。複数あれば最大、読めなければnull
function stationMinutes(r){
  const txt = (r.transit && (r.transit.howJa||"")) || (r.accessJa||"");
  let max = null;
  for(const m of txt.matchAll(/約?(\d+)\s*時間(?:\s*(\d+)\s*分)?|約?(\d+)\s*分/g)){
    const v = m[1] ? Number(m[1])*60 + Number(m[2]||0) : Number(m[3]);
    if(max===null || v>max) max = v;
  }
  return max;
}

function scoreResort(r, pref, levelIdx, isDayTrip){
  const km = roadKmFrom(pref, r);
  const route = (r.timeJa||"") + (r.accessJa||"");
  const indoor = /屋内|人工芝/.test(r.descJa||"");
  let score = 0;
  if(isDayTrip){
    // 新幹線で行けるスキー場は、道のりが長くても日帰りしやすい
    const eff = (wiz.transport===1 && /新幹線/.test(route) && km <= 300) ? km * 0.5 : km;
    score -= eff * 0.45;
    if(eff > 200) score -= 80;
    if(indoor) score -= 40;
  }else{
    score -= Math.max(0, km - 150) * 0.2 + km * 0.03;
    if(r.courses!=null) score += Math.min(r.courses, 30);
    if(indoor) score -= 100;
  }
  score += (r.terrain ? r.terrain[levelIdx] : 30) * 0.6;
  // はじめての人は、板・ブーツを借りられてレッスンを受けられることが何より大事
  if(wiz.level===0){
    const rent = r.rental && r.rental.available, school = r.school && r.school.available;
    score += rent===true ? 15 : rent===false ? -60 : -10;
    score += school===true ? 12 : school===false ? -25 : -6;
  }
  wiz.must.forEach(k=>{
    const v = mustValue(r, k);
    score += v===true ? 12 : v===false ? -50 : -12;
  });
  const limit = BUDGET_LIMITS[wiz.budget];
  if(limit!=null){
    if(r.liftAdult==null) score -= 8;
    else if(r.liftAdult <= limit) score += 12;
    else score -= 10 + (r.liftAdult - limit) / 100;
  }
  if(wiz.transport===1){
    const ok = transitOk(r);
    score += ok===true ? 15 : ok==="taxi" ? -25 : ok===false ? -60 : -15;
    // 電車で日帰りなら、駅から長く乗り継ぐスキー場は現実的でない
    const mins = stationMinutes(r);
    if(isDayTrip && mins!=null){ if(mins > 90) score -= 35; else if(mins > 60) score -= 15; }
  }
  return score;
}

function computeRanking(){
  const pref = PREFECTURES[wiz.prefIdx];
  const isDayTrip = wiz.trip===0;
  return RESORTS.filter(r=>r.lat!=null && !r.winterClosed).map(r=>({r, s:scoreResort(r, pref, terrIdx(), isDayTrip)})).sort((a,b)=>b.s-a.s).map(x=>x.r);
}

// 診断結果：選んだ条件ごとに「合う／要確認／合わない」
function recoMatches(r, fromKm){
  const out = [];
  const isDayTrip = wiz.trip===0;
  out.push(isDayTrip
    ? (fromKm >= 120 ? ["check", t("matchDayLong")] : ["ok", t(TRIP_OPTS[0])])
    : ["ok", t(TRIP_OPTS[1])]);
  const terr = r.terrain ? r.terrain[terrIdx()] : null;
  out.push([terr==null ? "check" : terr>=20 ? "ok" : "check", t(LEVEL_OPTS[wiz.level])]);
  const limit = BUDGET_LIMITS[wiz.budget];
  out.push([limit==null ? "ok" : r.liftAdult==null ? "check" : r.liftAdult<=limit ? "ok" : "no", t(BUDGET_OPTS[wiz.budget])]);
  if(wiz.transport===1){ const ok = transitOk(r); out.push([ok===true ? "ok" : ok===false ? "no" : "check", t(TRANSPORT_OPTS[1])]); }
  else out.push(["ok", t(TRANSPORT_OPTS[0])]);
  [...wiz.must].forEach(k=>{ const v = mustValue(r,k); out.push([v===true ? "ok" : v===false ? "no" : "check", t(k)]); });
  const ic = {ok:icon("check",14), check:icon("alert",14), no:icon("alert",14)};
  const sr = {ok:t("matchOk"), check:t("matchCheck"), no:t("matchNo")};
  return `<div class="reco-match" aria-label="${t("matchTitle")}">${out.map(([st,label])=>`<span class="mt ${st}">${ic[st]}<span>${label}</span><span class="sr-only">（${sr[st]}）</span></span>`).join("")}</div>`;
}

function renderRecommendation(){
  const pref = PREFECTURES[wiz.prefIdx];
  const ranked = computeRanking();
  const notYetShown = ranked.find(r=>!wiz.shown.includes(r.id)) || ranked[0];
  wiz.lastId = notYetShown.id;
  // アプリ版：診断を3回使った人にだけ、Apple公式の評価ダイアログを出す（表示回数はAppleが年3回までに制限）
  if(IS_NATIVE){
    try{
      const n = Number(localStorage.getItem("yukinavi_diag_count") || 0) + 1;
      localStorage.setItem("yukinavi_diag_count", String(n));
      const IR = window.Capacitor.Plugins && window.Capacitor.Plugins.InAppReview;
      if(n === 3 && IR) setTimeout(()=>IR.requestReview().catch(()=>{}), 2500);
    }catch(e){}
  }
  if(window.track) track("diagnosis_result", {resort: notYetShown.id, level: wiz.level, trip: wiz.trip, transport: wiz.transport, lang: state.lang});
  wiz.shown.push(notYetShown.id);
  if(wiz.shown.length > RESORTS.length) wiz.shown = [notYetShown.id];

  const r = notYetShown;
  const name = state.lang==="ja" ? r.nameJa : r.nameEn;
  const city = state.lang==="ja" ? r.cityJa : r.cityEn;
  const prefName = state.lang==="ja" ? pref.ja : pref.en;
  const fromKm = roadKmFrom(pref, r);
  const time = (state.lang==="ja" ? (r.timeJa||r.accessJa) : (r.timeEn||r.accessEn)) || "";
  const cond = (state.lang==="ja" ? wx(r).condJa : wx(r).condEn) || t("weatherLoading");
  const tripLabel = t(TRIP_OPTS[wiz.trip]);
  const levelLabel = t(LEVEL_OPTS[wiz.level]);
  const isDayTrip = wiz.trip===0;

  const onlineTicket = (r.ticket && r.ticket.onlineUrl) ? {label:t("prepBuyOnline"), href:safeUrl(r.ticket.onlineUrl)} : null;
  const transitRoute = {label:t("prepByTrain"), href:`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(state.lang==="ja"?r.nameJa:r.nameEn)}&travelmode=transit`, plain:true};
  const primary = wiz.trip===1 ? {label:t("ctaStay"), href:stayUrl(r)}
    : wiz.transport===1 ? (busRoute ? {label:t("prepBus"), href:busUrl(r)} : (onlineTicket || transitRoute))
    : onlineTicket;
  const box = document.getElementById("wizardResult");
  box.hidden = false;
  box.innerHTML = `
    <div class="reco-card">
      <article class="ticket lv-${terrIdx()}" aria-labelledby="tkName">
        <div class="tk-main">
          <div class="tk-head"><span class="tk-brand">YukiNavi</span><span class="tk-kind">${t("tkKind")}</span></div>
          <h2 class="tk-name" id="tkName">${name}</h2>
          <div class="reco-place">${icon("pin",14)} ${state.lang==="ja" ? r.prefJa : r.prefEn}</div>
          ${openInfo(r) ? `<div class="open-soon-line">${icon("alert",14)} ${openInfo(r).long}</div>` : ""}
          ${recoWeatherLine(r)}
        </div>
        <div class="tk-stub">
          <div class="tk-lv">${t("tkLevel")(levelLabel)}</div>
          ${recoStats(r, fromKm)}
        </div>
      </article>
      ${recoMatches(r, fromKm)}
      ${BUDGET_LIMITS[wiz.budget]!=null && r.liftAdult!=null && r.liftAdult > BUDGET_LIMITS[wiz.budget] ? `<div class="reco-approx-note">${t("overBudgetNote")(r.liftAdult)}</div>` : ""}
      ${wiz.transport===1 && transitOk(r)==="taxi" ? `<div class="reco-approx-note">${t("transitTaxiNote")}</div>` : ""}
      ${wiz.transport===1 && transitOk(r)!==true && transitOk(r)!=="taxi" ? `<div class="reco-approx-note">${t("transitUnknownNote")}</div>` : ""}
      ${[...wiz.must].some(k=>mustValue(r,k)!==true) ? `<div class="reco-approx-note">${t("mustUnmetNote")([...wiz.must].filter(k=>mustValue(r,k)!==true).map(k=>t(k)))}</div>` : ""}
      ${fromKm > 250 ? `<div class="reco-approx-note">${t("approxNote")}</div>` : ""}
      <div class="reco-rows">
        <div class="reco-row"><div class="ic">${icon("car",20)}</div><div><div class="rt">${t("rowAccess")}</div><div class="rv">${accessLine}${r.flight?`<br><span style="font-size:11.5px;color:var(--text-muted)">${t("flightNote")}</span>`:""}</div></div></div>
        <div class="reco-row"><div class="ic">${icon("ski",20)}</div><div><div class="rt">${t("prepRental")}</div><div class="rv">${t("prepRentalLine")(r.rental ? r.rental.available : null, r.school ? r.school.available : null, r.school ? r.school.english : null)}</div></div></div>
        ${r.town ? `<div class="reco-row"><div class="ic">${icon("pin",20)}</div><div><div class="rt">${t("rowTown")}</div><div class="rv">${(r.town.food + r.town.shop) >= 3 ? t("townLine")(r.town.food, r.town.shop) : t("townNone")}<br><span class="rv-sub">${t("townSrc")}</span></div></div></div>` : ""}
        <div class="reco-row"><div class="ic">${icon("bed",20)}</div><div><div class="rt">${t("rowStay")}</div><div class="rv">${stayVerdict}</div></div></div>
        <div class="reco-row"><div class="ic">${icon("backpack",20)}</div><div style="flex:1"><div class="rt">${t("rowPacking")}</div><div class="packing-list">${packing.map(p=>`<span class="packing-item">${p}</span>`).join("")}</div></div></div>
      </div>
      <div class="reco-actions">
        <button class="reco-secondary-btn" id="anotherBtn">${icon("refresh",15)} ${t("another")}</button>
        <button class="reco-secondary-btn" id="shareRecoBtn" style="flex:0 0 auto">${icon("share",15)} ${t("shareReco")}</button>
        ${primary ? `<button class="reco-secondary-btn" id="seeDetailBtn">${t("seeDetail")}</button><a class="reco-detail-btn" href="${primary.href}" target="_blank" rel="${primary.plain ? "noopener" : "noopener sponsored"}" style="text-align:center;text-decoration:none">${primary.label}</a>` : `<button class="reco-detail-btn" id="seeDetailBtn">${t("seeDetail")}</button>`}
      </div>
    </div>
    <button class="reco-secondary-btn" id="startOverBtn" style="width:100%">${t("startOver")}</button>
    ${a2hsCard()}
  `;
  document.getElementById("shareRecoBtn").addEventListener("click", e=>shareResort(r, e.currentTarget));
  bindA2hs();
  document.getElementById("anotherBtn").addEventListener("click", renderRecommendation);
  document.getElementById("seeDetailBtn").addEventListener("click", ()=>openDetail(r.id));
  document.getElementById("startOverBtn").addEventListener("click", resetWizard);
  document.getElementById("wizardQuiz").hidden = true;
  box.scrollIntoView({behavior:"smooth", block:"start"});
}

// 診断結果のシェア：そのスキー場の静的ページ（OGP付き）を共有する
async function shareResort(r, btn){
  const base = IS_NATIVE ? SITE_BASE : location.href.replace(/[#?].*$/,"").replace(/[^/]*$/,"");
  const url = base + (state.lang==="ja" ? `r/${r.id}/` : `en/r/${r.id}/`);
  const text = t("shareText")(state.lang==="ja" ? r.nameJa : r.nameEn);
  try{
    if(navigator.share){ await navigator.share({title:"YukiNavi", text, url}); return; }
    await navigator.clipboard.writeText(`${text} ${url}`);
    btn.innerHTML = `${icon("check",15)} ${t("shareCopied")}`;
  }catch(e){ /* 共有シートを閉じただけ */ }
}

// ホーム画面への追加案内（未追加・未非表示のときだけ、診断結果の下に1回出す）
const A2HS_KEY = "yukinavi_a2hs_dismissed";
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredInstall = e; });
function isStandalone(){ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }
function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1); }
function a2hsCard(){
  let dismissed = false;
  try{ dismissed = localStorage.getItem(A2HS_KEY)==="1"; }catch(e){}
  if(dismissed || isStandalone() || IS_NATIVE) return "";
  const how = deferredInstall ? t("a2hsAndroid") : isIOS() ? t("a2hsIOS") : t("a2hsOther");
  return `<div class="a2hs" id="a2hsCard"><b>${t("a2hsTitle")}</b>${how}
    <div class="a2hs-row"><button id="a2hsClose">${t("a2hsLater")}</button>${deferredInstall ? `<button class="a2hs-go" id="a2hsGo">${t("a2hsAdd")}</button>` : ""}</div></div>`;
}
function bindA2hs(){
  const card = document.getElementById("a2hsCard");
  if(!card) return;
  document.getElementById("a2hsClose").addEventListener("click", ()=>{ try{ localStorage.setItem(A2HS_KEY,"1"); }catch(e){} card.remove(); });
  const go = document.getElementById("a2hsGo");
  if(go) go.addEventListener("click", async ()=>{
    deferredInstall.prompt();
    const {outcome} = await deferredInstall.userChoice;
    deferredInstall = null;
    if(outcome==="accepted") card.remove();
  });
}

function resetWizard(){
  wiz.block=null; wiz.prefIdx=null; wiz.trip=null; wiz.level=null; wiz.budget=null; wiz.transport=null; wiz.must=new Set(); wiz.lastId=null; wiz.shown=[];
  document.getElementById("wizardResult").hidden = true;
  document.getElementById("wizardResult").innerHTML = "";
  document.getElementById("prefBlockWrap").hidden = true;
  document.getElementById("wizardQuiz").hidden = false;
  applyStaticText();
}

const VIEWS = [["wizard","navWizard","wizardView"],["map","navMap","mapView"],["nearby","navNearby","nearbyView"],["deals","navDeals","dealsView"],["gear","navGear","gearView"]];
function setView(view){
  state.view = view;
  VIEWS.forEach(([v,nav,el])=>{
    document.getElementById(nav).classList.toggle("active", v===view);
    document.getElementById(el).hidden = v!==view;
  });
  document.getElementById("searchRow").hidden = view!=="nearby";
  document.body.classList.toggle("map-mode", view==="map");
  if(view!=="map") document.getElementById("mapPreview").hidden = true;
  if(view==="nearby") renderGrid();
  if(view==="map") showMap();
  if(view==="deals") renderDeals();
  if(view==="gear") renderGearTab();
}

function render(){
  applyStaticText();
  if(state.view==="nearby") renderGrid();
  if(state.view==="map"){ renderMapChips(); renderMapLayer(); }
  if(state.view==="deals") renderDeals();
  if(state.view==="gear") renderGearTab();
  if(state.view==="wizard" && !document.getElementById("wizardResult").hidden && wiz.lastId){
    const idx = wiz.shown.indexOf(wiz.lastId);
    if(idx>-1) wiz.shown.splice(idx,1);
    renderRecommendation();
  }
}

document.getElementById("btnJa").addEventListener("click", ()=>{state.lang="ja"; render();});
document.getElementById("btnEn").addEventListener("click", ()=>{state.lang="en"; render();});
VIEWS.forEach(([v,nav])=>document.getElementById(nav).addEventListener("click", ()=>setView(v)));
document.getElementById("wizardSubmit").addEventListener("click", async ()=>{ await resortsReady; renderRecommendation(); });
document.getElementById("searchInput").addEventListener("input", (e)=>{state.query=e.target.value; renderGrid();});
document.getElementById("regionSelect").addEventListener("change", (e)=>{state.region=e.target.value; renderGrid();});
document.getElementById("sortSelect").addEventListener("change", (e)=>{state.sort=e.target.value; renderGrid();});
[["chipStudent","studentOnly"],["chipEnglish","englishOnly"],["chipFav","favOnly"]].forEach(([id,key])=>{
  document.getElementById(id).addEventListener("click", (e)=>{
    e.preventDefault();
    state[key] = !state[key];
    document.getElementById(id).classList.toggle("on", state[key]);
    renderGrid();
  });
});
document.getElementById("grid").addEventListener("click", (e)=>{
  const favBtn = e.target.closest("[data-fav]");
  if(favBtn){ toggleFav(favBtn.dataset.fav); renderGrid(); return; }
  const card = e.target.closest(".card");
  if(card) openDetail(card.dataset.id);
});
document.getElementById("grid").addEventListener("keydown", (e)=>{
  if(e.key!=="Enter" && e.key!==" ") return;
  const card = e.target.closest(".card");
  if(card && e.target===card){ e.preventDefault(); openDetail(card.dataset.id); }
});
document.getElementById("mapChips").addEventListener("click", (e)=>{
  const b = e.target.closest("[data-f]");
  if(!b) return;
  mapState.filter = b.dataset.f;
  closeMapPreview();
  renderMapChips(); renderMapLayer();
});
document.getElementById("mapSearch").addEventListener("input", renderSuggest);
document.getElementById("dealsSearch").addEventListener("input", (e)=>{ dealsState.q = e.target.value; renderDeals(); });
document.getElementById("dealsChips").addEventListener("click", (e)=>{
  const b = e.target.closest("[data-cat]"); if(!b) return;
  dealsState.cat = b.dataset.cat; renderDeals();
});
document.getElementById("mapSearch").addEventListener("keydown", (e)=>{
  if(e.key==="Enter"){ const first = document.querySelector("#mapSuggest button"); if(first) first.click(); }
});
document.getElementById("mapZoomIn").addEventListener("click", ()=>mapState.map && mapState.map.zoomIn());
document.getElementById("mapZoomOut").addEventListener("click", ()=>mapState.map && mapState.map.zoomOut());
document.getElementById("mapLocate").addEventListener("click", locateMe);
window.addEventListener("resize", ()=>{ if(state.view==="map"){ updateLayoutVars(); mapState.map && mapState.map.invalidateSize(); } });
document.getElementById("overlay").addEventListener("click", (e)=>{ if(e.target.id==="overlay") closeDetail(); });
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeDetail(); });

document.getElementById("icWizard").innerHTML = icon("sparkle", 20);
document.getElementById("icMap").innerHTML = icon("map", 20);
document.getElementById("icNearby").innerHTML = icon("search", 20);
document.getElementById("icDeals").innerHTML = icon("tag", 20);
document.getElementById("icGear").innerHTML = icon("backpack", 20);
document.getElementById("mapSearchIc").innerHTML = icon("search", 18);
document.getElementById("mapLocate").innerHTML = icon("locate", 20);

// 検索ページなどからのリンク：?lang=en で英語表示、?r=<id> でそのスキー場の詳細を開く
const params = new URLSearchParams(location.search);
if(params.get("lang")==="en") state.lang = "en";
applyStaticText();
setView("wizard");
const resortsReady = loadResorts();
resortsReady.then(()=>{
  loadWeatherCache(); render(); loadAllLiveWeather();
  if(IS_NATIVE) scheduleOpeningAlerts(null);
  const rid = params.get("r");
  if(rid && RESORTS.some(r=>r.id===rid)){ setView("nearby"); openDetail(rid); }
});
Promise.all([resortsReady, loadAllResorts()]).then(()=>{ renderHeroStat(); buildMapPoints(); if(state.view==="map") renderMapLayer(); });
loadDeals().then(()=>{ if(state.view==="deals") renderDeals(); });

if("serviceWorker" in navigator && !IS_NATIVE){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(err=>console.warn("SW registration failed", err));
  });
}
</script>

<script>
// アクセス解析（Google アナリティクス 4）。Webサイトだけで使い、アプリ版では読み込まない（App Storeの「データの収集なし」を守るため）
const GA_ID = "";
function track(name, params){ try{ if(window.gtag) window.gtag("event", name, params || {}); }catch(e){} }
(function(){
  if(IS_NATIVE || !GA_ID) return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ dataLayer.push(arguments); };
  gtag("js", new Date());
  gtag("config", GA_ID, {anonymize_ip: true});
  const sc = document.createElement("script");
  sc.async = true; sc.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
  document.head.appendChild(sc);
  // 予約・購入サイトへのクリック（初シーズンの一番大事な数字）
  document.addEventListener("click", e=>{
    const a = e.target.closest && e.target.closest("a[href^='http']");
    if(!a) return;
    const href = a.href;
    const partner = /rakuten/.test(href) ? "rakuten" : /klook/.test(href) ? "klook" : /a8\.net/.test(href) ? "a8" : /google\.com\/maps/.test(href) ? "maps" : "official";
    track("outbound_booking", {partner, place: a.closest(".sheet-bar") ? "bar" : a.closest(".reco-card") ? "result" : a.closest(".prep") ? "prep" : "other", link_text: (a.textContent||"").trim().slice(0,40)});
  }, true);
})();
</script>
<script>
// A8の自動リンク変換（Webサイトのみ。A8は通常アカウントの広告をアプリに載せるのを禁止しているので、アプリ版では読み込まない）。
// 読み込み時に1回しか走らないので、画面を開くたびに出るリンクにも掛け直す
(function(){
  if(IS_NATIVE) return;
  const sc = document.createElement("script");
  sc.src = "https://statics.8me.jp/a8link/a8linkmgr.js";
  sc.onload = start;
  document.body.appendChild(sc);
  function start(){
  if(typeof a8linkmgr !== "function") return;
  const run = ()=>{ try{ a8linkmgr({"config_id": "6ixko2yPeJmsYAuUlTIr"}); }catch(e){} };
  let timer = null;
  new MutationObserver(muts=>{
    if(!muts.some(m=>[...m.addedNodes].some(n=>n.nodeType===1 && (n.tagName==="A" || n.querySelector && n.querySelector("a[href^='http']"))))) return;
    clearTimeout(timer); timer = setTimeout(run, 700);
  }).observe(document.body, {childList:true, subtree:true});
  run();
  }
})();
</script>
